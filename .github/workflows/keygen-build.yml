name: 构建 iOS 注册机

on:
  workflow_dispatch:

jobs:
  build-keygen:
    name: 云端编译未签名注册机 IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: cd keygen && xcodegen generate

      - name: 编译注册机（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project keygen/JgyKeygen.xcodeproj \
            -scheme JgyKeygen \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath keygen/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          APP_PATH=$(find keygen/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "打包 $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r JgyKeygen-unsigned.ipa Payload

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JgyKeygen-ipa
          path: JgyKeygen-unsigned.ipa
          retention-days: 14
